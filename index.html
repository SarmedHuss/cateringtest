<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Élysée Order Book</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Élysée">
<meta name="theme-color" content="#F8F2E4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
html{-webkit-text-size-adjust:100%;min-height:calc(100% + env(safe-area-inset-top,0px))} /* iOS home-screen app: without this the page is one status bar too short and the bottom bar floats */
:root{color-scheme:light}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;font-size:16px;background:#F8F2E4;overscroll-behavior-y:none}
img{max-width:100%}
[hidden]{display:none!important}
@font-face{font-family:"Figtree";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/figtree-400.woff2") format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/figtree-500.woff2") format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/figtree-600.woff2") format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/figtree-700.woff2") format("woff2")}
@font-face{font-family:"Noto Naskh Arabic";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/naskh-400.woff2") format("woff2")}
@font-face{font-family:"Noto Naskh Arabic";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/naskh-700.woff2") format("woff2")}
@font-face{font-family:"Bodoni Moda";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/bodoni-500.woff2") format("woff2")}
@font-face{font-family:"Bodoni Moda";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/bodoni-600.woff2") format("woff2")}
</style>
</head>
<body>
<style>
:root{
  --bg:#F8F2E4; --surface:#FFFCF5; --surface-2:#EEE6D6; --line:#E2D8C5;
  --ink:#1C2029; --muted:#6B6252; --accent:#1C2029; --accent-ink:#F8F2E4; --accent-soft:#E6DCC8;
  --brass:#7D6A48; --brass-line:#B8A57F;
  --saffron:#86560C; --saffron-soft:#F3E3C4;
  --good:#3B6A46; --good-soft:#DFE8D9; --bad:#9C3A2E; --bad-soft:#F2DDD5;
  --shadow:0 1px 2px rgba(28,32,41,.05),0 6px 18px rgba(28,32,41,.06);
  --fab-shadow:0 8px 20px rgba(28,32,41,.28);
  --chart-in:#9C8456; --chart-out:#4A5263;
  --fs-title:28px; --fs-h2:22px; --fs-headline:17px; --fs-body:16px; --fs-sub:14px; --fs-label:12px;
  --chart-in:var(--accent); --chart-out:var(--saffron);
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#14171E; --surface:#1C2029; --surface-2:#262B35; --line:#323845;
    --ink:#F3ECDC; --muted:#A79E8C; --accent:#C9B089; --accent-ink:#14171E; --accent-soft:#3A3426;
    --brass:#B59C74; --brass-line:#8A7757;
    --saffron:#E0A94A; --saffron-soft:#3A3020;
    --good:#86B892; --good-soft:#1F3025; --bad:#E48B7D; --bad-soft:#3A2220;
    --shadow:0 1px 2px rgba(0,0,0,.35);
    --fab-shadow:0 8px 20px rgba(0,0,0,.45);
    --chart-in:#C9B089; --chart-out:#6C7589;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#14171E; --surface:#1C2029; --surface-2:#262B35; --line:#323845;
    --ink:#F3ECDC; --muted:#A79E8C; --accent:#C9B089; --accent-ink:#14171E; --accent-soft:#3A3426;
    --brass:#B59C74; --brass-line:#8A7757;
    --saffron:#E0A94A; --saffron-soft:#3A3020;
    --good:#86B892; --good-soft:#1F3025; --bad:#E48B7D; --bad-soft:#3A2220;
    --shadow:0 1px 2px rgba(0,0,0,.35);
    --fab-shadow:0 8px 20px rgba(0,0,0,.45);
    --chart-in:#C9B089; --chart-out:#6C7589;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs-body);line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field input:focus,.field select:focus,.field textarea:focus,.search:focus,.rate input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;max-width:640px;margin:0 auto}
.top h1{font-family:var(--display);font-size:var(--fs-title);margin:0;letter-spacing:-.01em;text-wrap:balance}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;font-size:var(--fs-sub);font-weight:600;color:var(--muted)}

main{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:4px 120px;display:flex;flex-direction:column;gap:18px}
section{display:flex;flex-direction:column;gap:10px}
h2{font-family:var(--display);font-size:var(--fs-h2);margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-family:var(--body);font-size:var(--fs-sub);color:var(--muted);font-weight:500;white-space:nowrap}
.label{font-size:var(--fs-label);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

.banner{background:var(--saffron-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:var(--fs-sub);display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner button{border:0;background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:600;font-size:var(--fs-sub);white-space:nowrap}

.monthbar{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.monthbar button{border:0;background:transparent;width:40px;height:36px;border-radius:9px;font-size:var(--fs-headline);color:var(--muted)}
.monthbar button:active{background:var(--surface-2)}
.monthbar strong{font-family:var(--body);font-weight:600;font-size:var(--fs-headline)}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--body);font-weight:700;font-size:clamp(var(--fs-body),5vw,var(--fs-h2));white-space:nowrap}
.kpi.profit .label{white-space:nowrap}
.kpi b .cc{display:block;font-family:var(--body);font-size:var(--fs-label);font-weight:700;letter-spacing:.06em;opacity:.7;line-height:1.2}
.kpi.profit b .cc{display:inline}
.kpi.profit{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 10px}
.kpi.profit b{margin-left:auto}
.kpi.profit b{font-size:clamp(var(--fs-h2),7vw,var(--fs-title))}
.kpi.profit{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.profit .label{color:var(--accent-ink);opacity:.8}
.kpi.neg{background:var(--bad);border-color:var(--bad)}
.sub{margin:-8px 0 0;color:var(--muted);font-size:var(--fs-sub)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.step{display:flex;flex-direction:column;gap:6px;font-size:var(--fs-label);font-weight:600;color:var(--muted)}
.step i{height:5px;border-radius:9px;background:var(--line)}
.step.done i{background:var(--accent)}
.step.done{color:var(--ink)}
.step.now{color:var(--accent)}
.next{background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.next.ok{border-color:var(--good)}
.next h3{font-family:var(--display);font-size:var(--fs-h2);margin:0}
.next p{margin:0}
.next .acts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.payhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.payhead b{font-family:var(--body);font-weight:700;font-size:var(--fs-h2)}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--good);border-radius:99px}
.docpage{display:block;width:100%;height:auto;border-radius:6px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.10)}
.docprev{display:flex;flex-direction:column;gap:12px;min-height:120px}
.catchips{display:flex;flex-wrap:wrap;gap:6px}
.catchips .chip{white-space:normal;text-align:left}
.tr{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.tr summary{font-weight:600;font-size:var(--fs-sub);cursor:pointer;color:var(--ink)}
.tr summary .muted{font-weight:400}
.tr[open] summary{margin-bottom:4px}
.trrow{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:10px}
.trbtn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:99px;padding:9px 16px;background:var(--accent-soft);color:var(--ink);font:inherit;font-size:var(--fs-sub);font-weight:600;cursor:pointer}
.trbtn:active{filter:brightness(.94)}
.trrow .hint:empty{display:none}
.checkrow{display:flex;align-items:center;gap:10px;font-size:var(--fs-sub);color:var(--muted)}
.checkrow input{width:20px;height:20px;accent-color:var(--accent)}
.fieldsuffix{display:flex;align-items:center;gap:8px}
.fieldsuffix span{font-weight:700;color:var(--muted);white-space:nowrap}
.err{margin:0;color:var(--bad);background:var(--bad-soft);border-radius:10px;padding:8px 10px;font-size:var(--fs-sub);font-weight:600}

.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px;border:0;border-top:1px solid var(--line);background:transparent;width:100%;text-align:left}
.row:first-child{border-top:0}
button.row:active{background:var(--surface-2)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .t{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere;line-height:1.3}
.row .s{font-size:var(--fs-sub);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.row .amt{font-weight:700}
.empty{padding:18px 14px;color:var(--muted);font-size:var(--fs-sub);text-align:center}

.datebox{width:46px;flex-shrink:0;text-align:center;border-radius:10px;background:var(--surface-2);padding:5px 0 6px;line-height:1.05}
.datebox .d{font-family:var(--body);font-weight:700;font-size:var(--fs-h2);display:block}
.datebox .m{font-size:var(--fs-label);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}

.pill{display:inline-flex;align-items:center;font-size:var(--fs-label);font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.p-inquiry{background:var(--saffron-soft);color:var(--saffron)}
.p-confirmed{background:var(--accent-soft);color:var(--accent)}
.p-done{background:var(--surface-2);color:var(--muted)}
.p-cancelled{background:var(--bad-soft);color:var(--bad)}
.p-good{background:var(--good-soft);color:var(--good)}
.p-warn{background:var(--saffron-soft);color:var(--saffron)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.pos{color:var(--good)} .neg-t{color:var(--bad)}

.openbox{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;background:var(--bad-soft);border-radius:14px 14px 0 0}
.openbox b{font-family:var(--body);font-weight:700;font-size:var(--fs-h2);color:var(--bad)}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:var(--fs-sub);font-weight:600;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:var(--fs-body)}
.grouphead{margin-top:6px}

/* calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal .wd{font-size:var(--fs-label);font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.day{border:0;background:transparent;min-width:0;padding-inline:0;border-radius:9px;aspect-ratio:1/1.05;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:3px;font-variant-numeric:tabular-nums;font-size:var(--fs-sub);max-width:100%}
.day.out{color:var(--muted);opacity:.4}
.day.today > span:first-child{background:var(--ink);color:var(--bg);border-radius:999px;width:24px;height:24px;display:grid;place-items:center;font-weight:700}
.day[aria-selected="true"]{background:var(--accent-soft)}
.dots{display:flex;gap:3px;height:6px}
.dot{width:6px;height:6px;border-radius:50%}
.dot.inquiry{background:var(--saffron)} .dot.confirmed{background:var(--accent)} .dot.done{background:var(--muted)} .dot.cancelled{background:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs-label);color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* finance */
.bars{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:118px 1fr auto;gap:10px;align-items:center;font-size:var(--fs-sub)}
.bar .track{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--chart-out);border-radius:99px}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px 6px}
.chart{position:relative;padding-top:20px}
.chartmax{position:absolute;top:0;left:2px;font-size:var(--fs-label);color:var(--muted)}
.plot{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));height:120px;border-bottom:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 50%}
.plot .col{display:flex;align-items:flex-end;justify-content:center;gap:3px;min-width:0}
.plot i{display:block;width:min(14px,34%);border-radius:3px 3px 0 0}
.plot .bin{background:var(--chart-in)} .plot .bout{background:var(--chart-out)}
.plot .col:not(.now) i{opacity:.5}
.xlab{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin-top:6px;text-align:center;font-size:var(--fs-label);color:var(--muted)}
.xlab>div{min-width:0}
.xlab span{display:block;white-space:nowrap;letter-spacing:-.01em}
.xlab .now span:first-child{color:var(--ink);font-weight:700}
.key{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 8px;vertical-align:-1px}
.key.in{background:var(--chart-in)} .key.out{background:var(--chart-out)}

/* bottom nav + fab */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:var(--fs-label);font-weight:600;color:var(--muted);padding:4px 0}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:7;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(14,107,90,.35)}
@media (min-width:680px){.fab{right:calc(50% - 320px + 16px)}}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,16,14,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 0;flex-shrink:0}
.sheethead{flex-shrink:0}
.sheethead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheethead h3{font-family:var(--display);font-size:var(--fs-h2);margin:0;text-wrap:balance}
.close{border:0;background:var(--surface-2);border-radius:999px;width:32px;height:32px;font-size:var(--fs-headline);color:var(--muted);flex-shrink:0}
form{display:flex;flex-direction:column;gap:8px}
form.sheetform{display:flex;flex-direction:column;gap:0;min-height:0;flex:1 1 auto}
.sheet:has(form.sheetform){overflow:hidden}
.formbody{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0;flex:1 1 auto;padding:3px 3px 4px;margin:-3px -3px 0;overscroll-behavior:contain}
.formfoot{flex-shrink:0;display:flex;flex-direction:column;gap:8px;margin-top:12px;padding-top:14px;border-top:1px solid var(--line)}
.two.narrow-first{grid-template-columns:minmax(0,1fr) minmax(0,2.2fr)}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:var(--fs-sub);font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 12px;width:100%;font-size:var(--fs-body);min-width:0;max-width:100%}
.field input[type=date],.field input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-height:45px;text-align:left}
.field input::-webkit-date-and-time-value{text-align:left}
.field textarea{min-height:44px;height:44px;max-height:140px;resize:none;overflow-y:auto}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:11px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:600;font-size:var(--fs-sub);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.btn{border:0;border-radius:12px;padding:13px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:var(--fs-body)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad-soft)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.kv dt{color:var(--muted);font-size:var(--fs-sub)}
.kv dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
.kv .sep{grid-column:1/-1;border-top:1px solid var(--line);margin:2px 0}
.copy{border:0;background:var(--surface-2);border-radius:7px;padding:2px 7px;font-size:var(--fs-label);margin-left:6px;color:var(--muted);font-weight:600}
.txdel{border:0;background:transparent;color:var(--muted);font-size:var(--fs-sub);padding:4px 6px;border-radius:7px}
.txdel.armed{background:var(--bad);color:#fff}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .btn{text-align:left;display:flex;justify-content:space-between;align-items:center}
.menu .btn span{font-weight:500;font-size:var(--fs-sub);opacity:.85}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:var(--fs-sub);z-index:40;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.cur{display:inline-grid;grid-auto-flow:column;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.cur button{border:0;background:transparent;border-radius:8px;padding:8px 12px;font-weight:700;font-size:var(--fs-sub);color:var(--muted)}
.cur button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pricerow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.hint{margin:0;font-size:var(--fs-sub);color:var(--muted)}
.rate{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.rate input{width:130px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 12px;font-size:var(--fs-body)}

/* ---- Élysée brand layer ---- */
.brandmark{display:flex;align-items:center;gap:11px;min-width:0}
.emblem{width:42px;height:42px;border-radius:50%;box-shadow:0 0 0 1px var(--brass-line);flex-shrink:0}
.eyebrow{display:block;font-size:var(--fs-label);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);margin-bottom:1px}
.top h1{font-weight:600;letter-spacing:0;line-height:1.1}
h2{font-weight:600;letter-spacing:.005em}
.sheethead h3,.next h3{font-weight:600}
.label{color:var(--brass);letter-spacing:.12em}
.iconbtn{border-color:var(--brass-line);color:var(--brass);background:transparent}
.next{border:1.5px solid var(--brass-line)}
.next .label::before,.next .label::after{content:"";display:inline-block;width:18px;height:1px;background:var(--brass-line);vertical-align:middle;margin:0 8px 2px 0}
.next .label::after{margin:0 0 2px 8px}
.kpi.profit .label{color:var(--accent-ink);opacity:.75}
.fab{box-shadow:var(--fab-shadow);border-radius:50%}
nav.tabs button[aria-current="page"]{color:var(--brass)}
nav.tabs button[aria-current="page"] svg{stroke-width:2.1}
.step.done i{background:var(--brass-line)}
.step.now{color:var(--brass)}
.day.today > span:first-child{background:var(--accent);color:var(--accent-ink)}
.banner{background:var(--accent-soft)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
</style>

const NF = {
  USD2:new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}),
  USD0:new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}),

const roundC = (v,c) => c==="IQD" ? Math.round(v) : Math.round(v*100)/100;
function fmt(v,c){
  v = roundC(v||0,c);
  if(c==="IQD") return (v<0?"−":"")+"IQD "+NF.IQD.format(Math.abs(v));
  const s = (Math.round(v*100)%100===0 ? NF.USD0 : NF.USD2).format(Math.abs(v));
  return (v<0?"−":"")+s;
}
/* short amounts for chart labels: 648 · 1.0K · 2.5K · 12K · 992M */
function shortNum(a){ if(a<1000) return NF.IQD.format(Math.round(a)); const [u,suf]=a>=1e9?[1e9,"B"]:a>=1e6?[1e6,"M"]:[1e3,"K"]; const n=a/u; return (n<10?n.toFixed(1):String(Math.round(n)))+suf; }
function fmtCompact(v,c,bare){ const a=Math.abs(v); const s = shortNum(a); if(bare) return (v<0?"−":"")+(c==="IQD"?s:"$"+s); return (v<0?"−":"+")+(c==="IQD"?"IQD "+s:"$"+s); }
function conv(v,from,to){ if(from===to) return v; const r=S.settings.rate; return from==="USD" ? v*r : v/r; }
const main = () => S.settings.main;
const M = v => fmt(v, main());
/* Accepts "1,250.50", "1250", "1250.5", "1,250,000", "250.000" (IQD), "$1,250", Arabic-Indic digits */
function parseAmount(str, c){
  let s = String(str??"")
    .replace(/[٠-٩]/g,d=>String(d.charCodeAt(0)-0x0660))
    .replace(/[۰-۹]/g,d=>String(d.charCodeAt(0)-0x06F0))
    .replace(/٫/g,".").replace(/٬/g,",")
    .replace(/[^\d.,]/g,"");
  if(!s) return NaN;
  const hasC = s.includes(","), hasD = s.includes(".");
  if(hasC && hasD){ if(s.lastIndexOf(",") > s.lastIndexOf(".")) s = s.replace(/\./g,"").replace(",","."); else s = s.replace(/,/g,""); }
  else if(hasC){ s = /^\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g,"") : s.replace(",","."); }
  else if(hasD){ if(/^\d{1,3}(\.\d{3}){2,}$/.test(s) || (c==="IQD" && /^\d{1,3}(\.\d{3})+$/.test(s))) s = s.replace(/\./g,""); }
  if(!/^\d+(\.\d+)?$/.test(s)) return NaN;
  return roundC(parseFloat(s), c);
}
const fmtInput = (v,c) => (v===""||v==null) ? "" : (c==="IQD" ? NF.IQD.format(v) : NF.plain.format(v));

function normalize(d){
  if(!d || !Array.isArray(d.orders) || !Array.isArray(d.tx)) throw new Error("not a backup");
  if(!d.v && d.sample) return seed();                         // old German sample data → fresh English sample
  const str = v => v==null ? "" : String(v);
  const st = d.settings||{};

const BACKUP_DAYS = 14;
function backupDue(){
  if(S.sample || (!S.orders.length && !S.tx.length)) return false;

}
async function exportBackup(){
  const txt = JSON.stringify(S, null, 1);
  const name = "order-book-backup-"+todayISO+".json";
  const done = how => { S.settings.lastBackup = todayISO; save(); render(); toast(how); };
  try{
    const file = new File([txt], name, {type:"application/json"});
    const touch = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    if(touch && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Order Book backup"});
      return done("Backup saved");
    }
  }catch(e){ if(e && e.name==="AbortError") return; }
  if(!IN_FRAME){
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt],{type:"application/json"})); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return done("Backup file downloaded");
  }
  const bk = document.getElementById("bk");
  if(bk){ bk.value = JSON.stringify(S); bk.hidden = false; }
  try{ await navigator.clipboard.writeText(JSON.stringify(S)); done("Backup copied as text"); }
  catch(e){ if(bk){ bk.select(); } toast("Select the text below and copy it"); }
}

  const dark = t==="dark" || (t!=="light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  root.style.colorScheme = dark ? "dark" : "light";
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{ m.setAttribute("content", getComputedStyle(document.body||root).getPropertyValue("--bg").trim() || m.getAttribute("content")); m.removeAttribute("media"); });

function fin(o){
  let paid=0,cost=0,mixed=false;
  for(const t of S.tx){ if(t.orderId!==o.id) continue; if(t.currency!==o.currency) mixed=true;
    const v = conv(t.amount,t.currency,o.currency); if(t.kind==="in") paid+=v; else cost+=v; }
  paid = roundC(paid,o.currency); cost = roundC(cost,o.currency);
  const billable = o.status==="confirmed"||o.status==="done";
  const rest = Math.max(0, roundC((o.price||0)-paid, o.currency));
  return {paid, cost, rest, open: billable?rest:0, mixed};
}
function payPill(o,f){
  if(o.status==="inquiry"||o.status==="cancelled") return "";
  if(o.price>0 && f.rest===0) return '<span class="pill p-good">Paid</span>';
  if(f.paid>0) return '<span class="pill p-warn">'+fmt(f.open,o.currency)+' due</span>';
  return '<span class="pill p-bad">Unpaid</span>';
}

function vOrders(){

  let list = S.orders.slice();
  if(U.filter==="upcoming") list = list.filter(o=>o.date>=todayISO && o.status!=="cancelled");
  else if(U.filter==="inquiry") list = list.filter(o=>o.status==="inquiry");
  else if(U.filter==="due") list = list.filter(o=>fin(o).open>0);
  else if(U.filter==="done") list = list.filter(o=>o.status==="done");
  if(q) list = list.filter(o=>[o.title,o.customer,o.location,o.type,o.notes].join(" ").toLowerCase().includes(q));
  const desc = U.filter==="done"||U.filter==="all";
  list.sort((a,b)=> desc ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date));
  const chip = (k,l)=>'<button class="chip" data-act="filter" data-f="'+k+'" aria-pressed="'+(U.filter===k)+'">'+l+'</button>';
  let h = '<section><input class="search" id="q" type="search" placeholder="Search name, place, occasion …" value="'+esc(U.q)+'">'+
    '<div class="chips">'+chip("upcoming","Upcoming")+chip("inquiry","Inquiries")+chip("due","Payment due")+chip("done","Done")+chip("all","All")+'</div></section>';
  if(!list.length) return h+'<div class="list"><div class="empty">No orders in this view.</div></div>';
  let cur="", buf="";
  const flush=()=>{ if(buf){ h+='<section class="grouphead"><span class="label">'+cur+'</span><div class="list">'+buf+'</div></section>'; buf=""; } };
  for(const o of list){ const d=toDate(o.date); const g=MONTHS[d.getMonth()]+" "+d.getFullYear(); if(g!==cur){ flush(); cur=g; } buf+=orderRow(o); }

  const [y,m] = U.cal;
  const first = new Date(y,m,1);
  const start = new Date(y,m,1-((first.getDay()+1)%7)); // Saturday first
  let h = '<section>'+monthBar("cal")+'<div class="cal">';
  for(const w of WEEK) h+='<div class="wd">'+w+'</div>';
  const cells = Math.ceil((((first.getDay()+1)%7) + new Date(y,m+1,0).getDate())/7)*7;
  for(let i=0;i<cells;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const s = iso(d);
    const evs = S.orders.filter(o=>o.date===s);
    h += '<button class="day'+(d.getMonth()!==m?' out':'')+(s===todayISO?' today':'')+'" data-act="day" data-d="'+s+'" aria-selected="'+(s===U.day)+'" aria-label="'+fmtLong(s)+(evs.length?', '+plural(evs.length,"event"):'')+'"><span>'+d.getDate()+'</span><span class="dots">'+evs.slice(0,3).map(o=>'<i class="dot '+o.status+'"></i>').join("")+'</span></button>';
  }
  h += '</div><div class="legend"><span><i class="dot inquiry"></i>Inquiry</span><span><i class="dot confirmed"></i>Confirmed</span><span><i class="dot done"></i>Done</span></div></section>';
  const evs = S.orders.filter(o=>o.date===U.day);
  h += '<section><h2>'+fmtLong(U.day)+'</h2><div class="list">'+(evs.length?evs.map(orderRow).join(""):'<div class="empty">Free. <button class="copy" data-act="newOrderDay">Add an order on this day</button></div>')+'</div></section>';
  const monthOrders = S.orders.filter(o=>ym(o.date)===mKey(U.cal)).sort((a,b)=>a.date.localeCompare(b.date));
  h += '<section><h2>All events in '+MONTHS[m]+' <small>'+monthOrders.length+'</small></h2><div class="list">'+(monthOrders.length?monthOrders.map(orderRow).join(""):'<div class="empty">No events.</div>')+'</div></section>';
  return h;
}

function vFin(){
  const key = mKey(U.finMonth);
  const tt = monthTotals(key);
  let h = '<section>'+monthBar("finMonth")+kpis(tt)+mixedNote()+'</section>';
  const months=[]; for(let i=5;i>=0;i--){ const a=shiftM(U.finMonth,-i); months.push({a,t:monthTotals(mKey(a))}); }
  const max = Math.max(1,...months.map(x=>Math.max(x.t.inc,x.t.out)));
  const pct = v => (v/max*100).toFixed(1);
  let ch='<div class="chart" role="img" aria-label="Income and expenses, last 6 months"><span class="chartmax num">'+esc(M(max))+'</span><div class="plot">';
  months.forEach((x,i)=>{ ch+='<div class="col'+(i===5?' now':'')+'"><i class="bin" style="height:'+pct(x.t.inc)+'%"></i><i class="bout" style="height:'+pct(x.t.out)+'%"></i></div>'; });
  ch+='</div><div class="xlab">'+months.map((x,i)=>'<div'+(i===5?' class="now"':'')+'><span>'+MSHORT[x.a[1]]+'</span><span class="num '+(x.t.profit<0?'neg-t':'pos')+'">'+(x.t.inc||x.t.out?esc(fmtCompact(x.t.profit,main(),true)):'&nbsp;')+'</span></div>').join("")+'</div></div>';
  h += '<section><h2>Last 6 months <small><span class="key in"></span>Income <span class="key out"></span>Expenses</small></h2><div class="chartbox">'+ch+'</div></section>';
  const cats={}; for(const t of S.tx){ if(t.kind!=="out"||ym(t.date)!==key) continue; cats[t.category]=(cats[t.category]||0)+conv(t.amount,t.currency,main()); }
  const ce=Object.entries(cats).sort((a,b)=>b[1]-a[1]); const cmax=Math.max(1,...ce.map(c=>c[1]));
  h += '<section><h2>Expenses by category</h2><div class="bars">'+(ce.length?ce.map(([c,v])=>'<div class="bar"><span>'+esc(c)+'</span><div class="track"><div class="fill" style="width:'+(v/cmax*100).toFixed(1)+'%"></div></div><span class="num">'+M(v)+'</span></div>').join(""):'<div class="empty">No expenses this month.</div>')+'</div></section>';
  const mo = S.orders.filter(o=>ym(o.date)===key && (o.status==="confirmed"||o.status==="done")).sort((a,b)=>a.date.localeCompare(b.date));
  if(mo.length){
    h += '<section><h2>Profit per order <small>price − costs</small></h2><div class="list">';
    for(const o of mo){ const f=fin(o), p=roundC(o.price-f.cost,o.currency);
      h += '<button class="row" data-act="open" data-id="'+o.id+'"><div class="main"><span class="t">'+esc(o.title)+'</span><span class="s">Price '+fmt(o.price,o.currency)+' · costs '+fmt(f.cost,o.currency)+'</span></div><div class="end"><span class="amt num '+(p<0?'neg-t':'pos')+'">'+fmt(p,o.currency)+'</span><span class="s muted" style="font-size:var(--fs-label)">'+(f.cost&&o.price?Math.round(p/o.price*100)+'% margin':'no costs yet')+'</span></div></button>';
    }
    h += '</div></section>';
  }
  const tx = S.tx.filter(t=>ym(t.date)===key).sort((a,b)=>b.date.localeCompare(a.date));
  h += '<section><h2>Entries <small>'+tx.length+'</small></h2><div class="list">'+(tx.length?tx.map(txRow).join(""):'<div class="empty">No entries this month.</div>')+'</div></section>';
  return h;
}
function txRow(t){
  const o = t.orderId? byId(t.orderId):null;

/* ---------- sheets ---------- */
const root = document.getElementById("sheet-root");
function openSheet(title, body, after){
  root.innerHTML = '<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="grab"></div><div class="sheethead"><h3>'+esc(title)+'</h3><button class="close" data-act="close" aria-label="Close">×</button></div>'+body+'</div></div>';
  if(after) after(root.querySelector(".sheet"));
}
function closeSheet(){ root.innerHTML=""; }
/* swipe down to close: from the top of the sheet, or anywhere once its content is scrolled to the top */
(function(){
  let d = null;
  const scroller = t => t.closest(".formbody") || t.closest(".sheet");
  root.addEventListener("touchstart", e => {
    const sh = e.target.closest(".sheet"); if(!sh || e.touches.length !== 1) return;
    if(e.target.closest("textarea, select, input[type=range]")) return;
    const sc = scroller(e.target);
    d = { sh, sc, scrim: sh.parentElement, y0: e.touches[0].clientY, x0: e.touches[0].clientX, t0: Date.now(), dy: 0, on: false, head: !!e.target.closest(".grab, .sheethead") };
  }, { passive: true });
  root.addEventListener("touchmove", e => {
    if(!d) return;
    const dy = e.touches[0].clientY - d.y0, dx = e.touches[0].clientX - d.x0;
    if(!d.on){
      if(Math.abs(dy) < 8 && Math.abs(dx) < 8) return;
      if(dy > 0 && Math.abs(dy) > Math.abs(dx) && (d.head || d.sc.scrollTop <= 0)){ d.on = true; d.sh.style.transition = "none"; d.sh.style.animation = "none"; if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); }
      else { d = null; return; }
    }
    d.dy = Math.max(0, dy);
    d.sh.style.transform = "translateY(" + d.dy + "px)";
    d.scrim.style.backgroundColor = "rgba(10,16,14," + (0.45 * Math.max(0, 1 - d.dy / 500)).toFixed(3) + ")";
    if(e.cancelable) e.preventDefault();
  }, { passive: false });
  const end = () => {
    if(!d) return; const x = d; d = null; if(!x.on) return;
    const v = x.dy / Math.max(1, Date.now() - x.t0);
    x.sh.style.transition = "transform .22s ease-out";
    if(x.dy > 120 || (v > 0.5 && x.dy > 40)){ x.sh.style.transform = "translateY(100%)"; x.scrim.style.transition = "background-color .22s"; x.scrim.style.backgroundColor = "rgba(10,16,14,0)"; setTimeout(closeSheet, 200); }
    else { x.sh.style.transform = ""; x.scrim.style.backgroundColor = ""; }
  };
  root.addEventListener("touchend", end); root.addEventListener("touchcancel", end);
})();
const curToggle = (id,c) => '<div class="cur" id="'+id+'" role="group" aria-label="Currency"><button type="button" data-c="USD" aria-pressed="'+(c==="USD")+'">$</button><button type="button" data-c="IQD" aria-pressed="'+(c==="IQD")+'">IQD</button></div>';
function wireCur(sh, id, onChange){
  const g = sh.querySelector("#"+id);
  g.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{ g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); onChange(b.dataset.c, true); }));
  return c => g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.c===c)));
}

function sheetOrder(id){
  const o = byId(id); if(!o) return;
  const f = fin(o), c = o.currency, F = v => fmt(v,c);
  const price = o.price||0, rest = f.rest;
  const g = +o.guests>0 ? +o.guests : 0;
  const future = o.date > todayISO, dd = daysUntil(o.date);
  const txs = S.tx.filter(t=>t.orderId===o.id).sort((a,b)=>a.date.localeCompare(b.date));
  const sub = fmtMed(o.date)+(o.time?' · '+esc(o.time):'')+' · '+esc(o.type);

  const FLOW = ["inquiry","confirmed","done"];
  let top;
  if(o.status==="cancelled") top = '<div class="banner" style="background:var(--bad-soft)"><span><b>Cancelled.</b> No longer counted in payments due.</span></div>';
  else { const idx = FLOW.indexOf(o.status);
    top = '<ol class="steps" aria-label="Progress">'+FLOW.map((st,i)=>'<li class="step'+(i<=idx?' done':'')+(i===idx?' now':'')+'"'+(i===idx?' aria-current="step"':'')+'><i></i>'+(i<idx?'✓ ':'')+STATUS[st]+'</li>').join("")+'</ol>'; }

  const payBtn = (label,cat,amt,primary)=>'<button class="btn'+(primary?'':' ghost')+'" data-act="newtx" data-kind="in" data-id="'+o.id+'" data-cat="'+cat+'" data-amount="'+(amt||"")+'">'+label+'</button>';
  const stBtn = (label,st,primary)=>'<button class="btn'+(primary?'':' ghost')+'" data-act="setstatus" data-id="'+o.id+'" data-s="'+st+'">'+label+'</button>';
  let nt, nx, nb="";
  if(o.status==="inquiry"){
    nt="Waiting for the customer";
    nx="Has the customer said yes? Then confirm. From then on the order counts in payments due.";
    nb=stBtn("Customer said yes","confirmed",true)+stBtn("Customer said no","cancelled",false);
  } else if(o.status==="confirmed" && future){
    if(f.paid===0 && price>0){ nt="Deposit not received"; nx="Event "+inDays(dd)+". Record the deposit as soon as it arrives."; nb=payBtn("Record deposit","Deposit","",true); }
    else if(rest>0){ nt="Event "+inDays(dd); nx="Deposit received. Still due: <b>"+F(rest)+"</b>."; nb=payBtn("Record payment","Final payment",rest,true); }
    else { nt="Event "+inDays(dd); nx="Fully paid. Mark as done after the event."; nb=stBtn("Event is done","done",false); }
  } else if(o.status==="confirmed"){
    nt = dd===0?"Event is today":"Event was on "+fmtShort(o.date);
    nx = "When everything went well, mark it as done."+(rest>0?" Still due: <b>"+F(rest)+"</b>.":"");
    nb = stBtn("Event is done","done",true)+(rest>0?payBtn("Record payment","Final payment",rest,false):"");
  } else if(o.status==="done"){
    if(rest>0){ nt="Final payment due"; nx="The customer still owes <b>"+F(rest)+"</b>."; nb=payBtn("Record final payment","Final payment",rest,true); }
    else { nt="Completed"; nx="Event done and fully paid."; }
  } else { nt="Cancelled"; nx="If the customer books after all, reopen the order."; nb=stBtn("Reopen order","inquiry",false); }
  const next = '<section class="next'+(o.status==="done"&&rest===0?' ok':'')+'"><span class="label">Next step</span><h3>'+nt+'</h3><p>'+nx+'</p>'+(nb?'<div class="acts">'+nb+'</div>':'')+'</section>';

  let pay;
  if(price<=0) pay = '<div class="card"><p class="muted" style="margin:0">No price agreed yet. <button class="copy" data-act="editorder" data-id="'+o.id+'">Add price</button></p></div>';
  else { const pct = Math.min(100, f.paid/price*100);
    pay = '<div class="card"><div class="payhead"><span><b class="num">'+F(f.paid)+'</b> <span class="muted">of '+F(price)+' paid</span></span><span class="num '+(rest>0?'neg-t':'pos')+'" style="font-weight:700">'+(rest>0?F(rest)+' due':'✓ fully paid')+'</span></div>'+
      '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(pct)+'"><i style="width:'+pct.toFixed(1)+'%"></i></div>'+
      (o.status==="inquiry"?'<p class="hint">Quoted price. Becomes binding once the customer says yes.</p>':'')+'</div>'; }

  const items = o.items||[];
  const svc = '<section><h2>Services <small>'+(items.length?plural(items.length,"item"):'')+'</small></h2>'+
    (items.length
      ? '<div class="list">'+items.map(it=>'<button class="row" data-act="edititem" data-id="'+o.id+'" data-item="'+it.id+'"><div class="main"><span class="t">'+esc(it.name)+'</span><span class="s">'+qtyLabel(it)+(it.unit==="flat"&&it.qty===1?'':' × '+F(it.price))+'</span></div><div class="end"><span class="amt num">'+F(lineTotal(it,c))+'</span></div></button>').join("")+'</div>'+
        '<dl class="kv num"><dt>Subtotal</dt><dd>'+F(itemsSum(o))+'</dd><dt><button class="copy" style="margin:0" data-act="discount" data-id="'+o.id+'">'+(o.discount?'Discount':'+ Add discount')+'</button></dt><dd>'+(o.discount?'− '+F(o.discount):'')+'</dd><div class="sep"></div><dt><b style="color:var(--ink)">Total</b></dt><dd><b>'+F(price)+'</b></dd></dl>'
      : '<div class="card"><p class="muted" style="margin:0">Add the services (buffet, staff, rental …). The price then adds up by itself, and they appear on the quote and invoice.</p></div>')+
    '<div class="btnrow"><button class="btn ghost" data-act="additem" data-id="'+o.id+'">+ Service</button><button class="btn ghost" data-act="doc" data-id="'+o.id+'">'+(o.status==="inquiry"?"Quote PDF":"Invoice PDF")+'</button></div></section>';

  const profit = roundC(price - f.cost, c);
  const kg = '<dl class="kv num"><dt>Price</dt><dd>'+F(price)+'</dd><dt>Expenses</dt><dd>'+(f.cost?'− '+F(f.cost):F(0))+'</dd><div class="sep"></div>'+
    '<dt><b style="color:var(--ink)">Profit</b></dt><dd class="'+(profit<0?'neg-t':'pos')+'">'+F(profit)+(price&&f.cost?' <span class="muted" style="font-weight:500">· '+Math.round(profit/price*100)+'% margin</span>':'')+'</dd>'+
    (g&&price?'<dt>Price per guest</dt><dd>'+F(price/g)+'</dd>':'')+(g&&f.cost?'<dt>Cost per guest</dt><dd>'+F(f.cost/g)+'</dd>':'')+'</dl>'+
    (f.mixed?'<p class="hint">Entries in the other currency are converted at $1 = IQD '+NF.IQD.format(S.settings.rate)+'.</p>':'')+
    (f.cost?'':'<p class="hint">No expenses recorded yet. Add food, staff etc. under Entries below to see the real profit.</p>');

  const det = '<dl class="kv"><dt>Customer</dt><dd>'+esc(o.customer||"–")+'</dd>'+
    (o.phone?'<dt>Phone</dt><dd><span class="num">'+esc(o.phone)+'</span><button class="copy" data-act="copy" data-v="'+esc(o.phone)+'">Copy</button></dd>':'')+
    (o.location?'<dt>Place</dt><dd>'+esc(o.location)+'</dd>':'')+(g?'<dt>Guests</dt><dd class="num">'+g+'</dd>':'')+
    (o.notes?'<dt style="grid-column:1/-1">Notes</dt><dd style="font-weight:500;text-align:left;grid-column:1/-1">'+esc(o.notes)+'</dd>':'')+'</dl>';

  const body = '<p class="sub">'+sub+'</p>'+top+next+svc+
    '<section><h2>Payment</h2>'+pay+'</section>'+
    '<section><h2>Details</h2>'+det+'</section>'+
    '<section><h2>Costs &amp; profit</h2>'+kg+'</section>'+
    '<section><h2>Entries <small>'+txs.length+'</small></h2><div class="list">'+(txs.length?txs.map(txRow).join(""):'<div class="empty">No payments or expenses yet.</div>')+'</div>'+
    '<div class="btnrow"><button class="btn ghost" data-act="newtx" data-kind="in" data-id="'+o.id+'">+ Payment</button><button class="btn ghost" data-act="newtx" data-kind="out" data-id="'+o.id+'">+ Expense</button></div></section>'+
    '<div class="btnrow"><button class="btn ghost" data-act="editorder" data-id="'+o.id+'">Edit</button><button class="btn danger" data-act="delorder" data-id="'+o.id+'">Delete order</button></div>';
  openSheet(o.title, body);
}

const NF_2 = new Intl.NumberFormat("en-US",{minimumFractionDigits:2, maximumFractionDigits:2});
function docNumber(kind, take){
  const y = String(new Date().getFullYear()), key = kind==="invoice" ? "inv" : "q";
  const n = (S.settings.seq[key][y]||0) + 1;
  if(take) S.settings.seq[key][y] = n;
  return (kind==="invoice" ? "INV-" : "Q-") + y + "-" + String(n).padStart(3,"0");
}
function docData(o, kind, cur, take, lang){
  const field = kind==="invoice" ? "invoiceNo" : "quoteNo";
  let number = o[field];
  if(!number){ number = docNumber(kind, take); if(take){ o[field] = number; save(); } }
  const cv = v => roundC(conv(v, o.currency, cur), cur);
  const lines = (o.items && o.items.length)
    ? o.items.map(it => { const price = cv(it.price); return {name:it.name, nameAr:it.nameAr, nameKu:it.nameKu, unit:it.unit, qty:it.qty, price, total:roundC(it.qty*price, cur)}; })
    : [{name:(o.type==="Other"?"Catering":o.type+" catering")+(+o.guests>0?" for "+o.guests+" guests":""), nameAr:DOC_L.ar.catering+" – "+(TYPES_AR[o.type]||"مناسبة"), nameKu:DOC_L.ku.catering+" – "+(TYPES_KU[o.type]||"بۆنە"), unit:"flat", qty:1, price:cv(o.price), total:cv(o.price)}];
  const subtotal = roundC(lines.reduce((a,l)=>a+l.total,0), cur);
  const discount = (o.items && o.items.length) ? Math.min(subtotal, cv(o.discount||0)) : 0;
  const total = roundC(subtotal - discount, cur);
  let paid = 0; for(const t of S.tx) if(t.orderId===o.id && t.kind==="in") paid += conv(t.amount, t.currency, cur);
  paid = roundC(paid, cur);
  return {kind, lang: DOC_L[lang] ? lang : "", number, date:todayISO, validUntil:iso(new Date(toDate(todayISO).getTime()+14*864e5)), cur, converted:cur!==o.currency, from:o.currency, rate:S.settings.rate,
    order:o, lines, subtotal, discount, total, paid: kind==="invoice" ? Math.min(paid,total) : 0, balance: kind==="invoice" ? Math.max(0, roundC(total-paid,cur)) : total, biz:S.settings.business};
}

  const words = String(text).split(/\s+/).filter(Boolean), out = []; let cur = "";
  for(const w of words){ const t = cur ? cur+" "+w : w; if(!cur || ctx.measureText(t).width <= maxW) cur = t; else { out.push(cur); cur = w; } }
  if(cur) out.push(cur); return out.length ? out : [""];
}

  if(o.phone){ T(o.phone, M, ly, {s:9.5, c:P.muted}); ly += 13; }
  ctx.font = "700 11px "+BODY; for(const l of wrapText(ctx, o.title, W-M-c2)){ T(l, c2, ry, {s:11, w:700}); ry += 14; }
  T(o.type, c2, ry, {s:9.5, c:P.muted}); if(L) A(L.types[o.type]||"", W-M, ry, {s:9.5, c:P.muted}); ry += 13;
  T(fmtLong(o.date)+(o.time?", "+o.time:""), c2, ry, {s:9.5, c:P.muted}); ry += 13;

  y = Math.max(ly, ry) + 16;

  // ---- services table ----
  const X = {dL:M+10, dR:M+262, q:M+318, u:W-M-104, a:W-M-10};
  const curLbl = d.cur==="IQD" ? "IQD" : "USD";
  const HH = L ? 36 : 26;
  const head = () => {
    ctx.fillStyle = P.soft; ctx.fillRect(M, y, W-2*M, HH);
    T("Description", X.dL, y+16, {s:8.5, w:700}); if(L) A(L.desc, X.dR, y+16, {s:9.5, w:700, c:P.muted});
    T("Qty", X.q, y+16, {s:8.5, w:700, a:"right"}); if(L) A(L.qty, X.q, y+29, {s:9, c:P.muted});
    T("Unit price ("+curLbl+")", X.u, y+16, {s:8.5, w:700, a:"right"}); if(L) A(L.unit, X.u, y+29, {s:9, c:P.muted});
    T("Amount ("+curLbl+")", X.a, y+16, {s:8.5, w:700, a:"right"}); if(L) A(L.amount, X.a, y+29, {s:9, c:P.muted});
    y += HH + 6;
  };
  const LIMIT = H - M - 60;
  const contHead = () => { T((isQ ? "Quote " : "Invoice ")+d.number+" · continued", M, y+10, {s:9.5, w:700}); if(L) A((isQ ? L.quote : L.invoice)+" – "+L.cont, W-M, y+10, {s:9.5, c:P.muted}); y += 26; };
  head();
  for(const l of d.lines){
    ctx.font = "600 10.5px "+BODY; const nl = wrapText(ctx, l.name, X.dR - X.dL - 8);
    const rowH = 12 + nl.length*13 + 14;
    if(y + rowH > LIMIT){ newPage(); y = M; contHead(); head(); }
    let yy = y + 12;
    for(const t of nl){ T(t, X.dL, yy, {s:10.5, w:600}); yy += 13; }
    T(UNITS[l.unit] ? UNITS[l.unit].en : "", X.dL, yy, {s:8.5, c:P.muted}); A(tr(l), X.dR, yy, {s:9.5, c:P.muted});
    T(NF.plain.format(l.qty), X.q, y+12, {s:10, a:"right"});
    T(money(l.price), X.u, y+12, {s:10, a:"right"});
    T(money(l.total), X.a, y+12, {s:10, w:700, a:"right"});
    y += rowH; rule(y-6, P.line, 0.6);
  }

  // ---- totals + notes ----
  const rows = [["Subtotal","subtotal",moneyC(d.subtotal)]];
  if(d.discount) rows.push(["Discount","discount","− "+moneyC(d.discount)]);
  rows.push(["Total","total",moneyC(d.total),"big"]);
  if(!isQ && d.paid) rows.push(["Paid","paid","− "+moneyC(d.paid)]);
  if(!isQ) rows.push(["Balance due","balance",moneyC(d.balance),"band"]);
  const notes = [];
  if(d.converted) notes.push(["Amounts converted from "+(d.from==="IQD"?"Iraqi dinar":"US dollars")+" at $1 = IQD "+NF.IQD.format(d.rate)+".", L ? L.conv(NF.IQD.format(d.rate)) : ""]);
  if(isQ) notes.push(["This quote is valid for 14 days.", L ? L.validNote : ""]);
  if(b.note) notes.push([b.note, ""]);
  const need = rows.length*22 + 40;
  if(y + need > LIMIT){ newPage(); y = M; contHead(); }
  y += 14;
  const tx0 = W - M - 236; let ty = y;
  for(const [en, key, v, kind] of rows){
    if(kind==="band"){ ctx.fillStyle = P.soft; ctx.fillRect(tx0-10, ty-15, W-M-tx0+10, 24); }
    if(kind==="big") rule(ty-15, P.line, 0.75);
    const big = kind==="big" || kind==="band";
    T(en, tx0, ty, {s:big?11:9.5, w:big?700:400, c:big?P.ink:P.muted});
    if(L) A(L[key], W-M-112, ty, {s:big?10.5:9.5, w:big?700:400, c:big?P.ink:P.muted});
    T(v, W-M, ty, {s:big?12:10, w:700, a:"right", c:kind==="band"?P.accent:P.ink});
    ty += big ? 26 : 20;
  }
  let ny = y;
  for(const [en, loc] of notes){
    ctx.font = "400 9px "+BODY; for(const l of wrapText(ctx, en, tx0 - M - 30)){ T(l, M, ny, {s:9, c:P.muted}); ny += 12; }
    if(loc){ ctx.font = "400 9.5px "+AR; for(const l of wrapText(ctx, loc, tx0 - M - 30)){ A(l, tx0 - 30, ny, {s:9.5, c:P.muted}); ny += 13; } }
    ny += 6;
  }

  // ---- footer on every page ----
  pages.forEach((cv, i) => {
    ctx = cv.getContext("2d");
    rule(H-M-22, P.accent, 0.8);
    T("Thank you for choosing "+b.name+".", W/2, H-M-6, {s:9, w:600, a:"center"});
    if(L) A(L.thanks, W/2, H-M+8, {s:9.5, c:P.muted, a:"center"});
    if(pages.length>1) T((i+1)+" / "+pages.length, W-M, H-M-6, {s:8.5, c:P.muted, a:"right"});
    T(d.number, M, H-M-6, {s:8.5, c:P.muted});
  });
  return pages;
}
/* minimal PDF writer: one JPEG per A4 page */
async function pagesToPdf(pages){
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const push = x => { const b = typeof x === "string" ? enc.encode(x) : x; parts.push(b); len += b.length; };
  const obj = (id, fn) => { offs[id] = len; push(id+" 0 obj\n"); fn(); push("\nendobj\n"); };
  push("%PDF-1.4\n%âãÏÓ\n");
  const n = pages.length, kids = pages.map((_,i)=>(3+i*3)+" 0 R").join(" ");
  obj(1, ()=>push("<< /Type /Catalog /Pages 2 0 R >>"));
  obj(2, ()=>push("<< /Type /Pages /Kids ["+kids+"] /Count "+n+" >>"));
  for(let i=0;i<n;i++){
    const cv = pages[i], pg = 3+i*3, ct = pg+1, im = pg+2;
    const blob = await new Promise(r=>cv.toBlob(r, "image/jpeg", 0.9));
    const jpg = new Uint8Array(await blob.arrayBuffer());
    const cs = "q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";
    obj(pg, ()=>push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 "+im+" 0 R >> >> /Contents "+ct+" 0 R >>"));
    obj(ct, ()=>push("<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream"));
    obj(im, ()=>{ push("<< /Type /XObject /Subtype /Image /Width "+cv.width+" /Height "+cv.height+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>\nstream\n"); push(jpg); push("\nendstream"); });
  }
  const size = 3 + n*3, xref = len;
  push("xref\n0 "+size+"\n0000000000 65535 f \n");
  for(let id=1; id<size; id++) push(String(offs[id]).padStart(10,"0")+" 00000 n \n");
  push("trailer\n<< /Size "+size+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF\n");
  return new Blob(parts, {type:"application/pdf"});
}
async function shareFile(blob, name, title){
  const file = new File([blob], name, {type: blob.type});
  try{
    const touch = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    if(touch && navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title}); return "shared"; }
  }catch(e){ if(e && e.name==="AbortError") return "cancelled"; }
  if(!IN_FRAME){
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return "downloaded";
  }
  return "blocked";
}
function sheetDoc(id){
  const o = byId(id); if(!o) return;
  let kind = o.status==="inquiry" ? "quote" : "invoice", cur = o.currency, lang = "", busy = false;
  const body = '<div class="seg" id="doc-kind" role="group" aria-label="Document"><button type="button" data-k="quote" aria-pressed="'+(kind==="quote")+'">Quote</button><button type="button" data-k="invoice" aria-pressed="'+(kind==="invoice")+'">Invoice</button></div>'+
    '<div class="field"><label>Currency on the document</label>'+curToggle("doc-cur",cur)+'</div>'+
    '<div class="field"><label>Second language <span class="muted" style="font-weight:400">(English is always included)</span></label><div class="seg" id="doc-lang" role="group" aria-label="Second language"><button type="button" data-l="" aria-pressed="true">None</button><button type="button" data-l="ar" aria-pressed="false" lang="ar">العربية</button><button type="button" data-l="ku" aria-pressed="false" lang="ckb">کوردی</button></div></div>'+
    (!(o.items && o.items.length) ? '<p class="hint">Tip: add services to the order to list them one by one. Right now the document shows one line with the total.</p>' : '')+
    '<div class="docprev" id="doc-prev" aria-live="polite"></div>'+
    '<div class="formfoot" style="position:sticky;bottom:0;background:var(--bg);padding-bottom:4px"><button class="btn" id="doc-share" type="button">Share PDF</button><p class="hint" id="doc-num" style="text-align:center"></p></div>';
  openSheet("Quote & invoice", body, sh=>{
    const prev = sh.querySelector("#doc-prev"), num = sh.querySelector("#doc-num");
    const draw = async () => {
      prev.innerHTML = '<p class="hint">Preparing preview …</p>';
      const d = docData(o, kind, cur, false, lang);
      num.textContent = (o[kind==="invoice"?"invoiceNo":"quoteNo"] ? "" : "Next number: ") + d.number;
      const pages = await renderDoc(d);
      if(!sh.isConnected) return;
      prev.innerHTML = "";
      pages.forEach((cv,i)=>{ const img = new Image(); img.className = "docpage"; img.alt = (kind==="quote"?"Quote":"Invoice")+" page "+(i+1); img.src = cv.toDataURL("image/jpeg", 0.85); prev.appendChild(img); });
    };
    sh.querySelectorAll("#doc-kind button").forEach(bt=>bt.addEventListener("click",()=>{ kind = bt.dataset.k; sh.querySelectorAll("#doc-kind button").forEach(x=>x.setAttribute("aria-pressed", String(x===bt))); draw(); }));
    wireCur(sh, "doc-cur", nc=>{ cur = nc; draw(); });
    sh.querySelectorAll("#doc-lang button").forEach(bt=>bt.addEventListener("click",()=>{ lang = bt.dataset.l; sh.querySelectorAll("#doc-lang button").forEach(x=>x.setAttribute("aria-pressed", String(x===bt))); draw(); }));
    sh.querySelector("#doc-share").addEventListener("click", async () => {
      if(busy) return; busy = true;
      try{
        const d = docData(o, kind, cur, true, lang);
        num.textContent = d.number;
        const blob = await pagesToPdf(await renderDoc(d));
        const safe = (d.number+" "+(o.customer||o.title)).replace(/[^\w\- .]+/g,"").trim().replace(/\s+/g,"-");
        const r = await shareFile(blob, safe+".pdf", (kind==="quote"?"Quote ":"Invoice ")+d.number);
        render();
        if(r==="downloaded") toast("PDF saved");
        else if(r==="blocked") toast("Sharing works in the installed app");
      } finally { busy = false; }
    });
    draw();
  });
}

let armed = null;
function arm(btn, label, fn){
  if(armed===btn){ fn(); armed=null; return; }
  if(armed){ armed.classList.remove("armed"); armed.textContent=armed.dataset.orig; }
  btn.dataset.orig=btn.textContent; btn.textContent=label; btn.classList.add("armed"); armed=btn;
  setTimeout(()=>{ if(armed===btn){ btn.classList.remove("armed"); btn.textContent=btn.dataset.orig; armed=null; } },3500);
}

document.addEventListener("click",e=>{
  const tabBtn = e.target.closest("#tabs button");
  if(tabBtn){ U.tab=tabBtn.dataset.tab; try{localStorage.setItem(KEY+":tab",U.tab);}catch(err){} render(); window.scrollTo(0,0); return; }
  const el = e.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if(a==="scrim"){ if(e.target===el) closeSheet(); return; }
  if(a==="close") return closeSheet();
  if(a==="mprev"||a==="mnext"){ U[el.dataset.w]=shiftM(U[el.dataset.w],a==="mprev"?-1:1); if(el.dataset.w==="cal"){ const c=U.cal; U.day=c[0]+"-"+pad(c[1]+1)+"-01"; } return render(); }
  if(a==="open") return sheetOrder(id);
  if(a==="filter"){ U.filter=el.dataset.f; return render(); }
  if(a==="day"){ U.day=el.dataset.d; const d=toDate(U.day); if(d.getMonth()!==U.cal[1]) U.cal=[d.getFullYear(),d.getMonth()]; return render(); }
  if(a==="plus") return sheetPlus();
  if(a==="newOrder") return sheetOrderForm(null, U.tab==="cal"?U.day:null);
  if(a==="newOrderDay") return sheetOrderForm(null, U.day);
  if(a==="editorder") return sheetOrderForm(id);
  if(a==="newtx") return sheetTxForm(null, el.dataset.kind, id||null, {cat:el.dataset.cat||"", amount:el.dataset.amount?+el.dataset.amount:""});
  if(a==="edittx") return sheetTxForm(id);
  if(a==="setstatus"){ const o=byId(id); o.status=el.dataset.s; save(); render(); sheetOrder(id); return toast({confirmed:"Order confirmed",done:"Marked as done",cancelled:"Order cancelled",inquiry:"Reopened as inquiry"}[o.status]); }
  if(a==="delorder") return arm(el,"Really delete? Tap again",()=>{ S.orders=S.orders.filter(o=>o.id!==id); S.tx=S.tx.filter(t=>t.orderId!==id); save(); closeSheet(); render(); toast("Order deleted"); });
  if(a==="deltx") return arm(el,"Really delete? Tap again",()=>{ const t=S.tx.find(x=>x.id===id); S.tx=S.tx.filter(x=>x.id!==id); save(); render(); if(t&&t.orderId) sheetOrder(t.orderId); else closeSheet(); toast("Entry deleted"); });
  if(a==="copy"){ const v=el.dataset.v; try{ navigator.clipboard.writeText(v).then(()=>toast("Copied"),()=>toast(v)); }catch(err){ toast(v); } return; }
  if(a==="data") return sheetData();
  if(a==="additem") return sheetItem(id, null, null);
  if(a==="edititem") return sheetItem(id, el.dataset.item, null);
  if(a==="delitem") return arm(el,"Remove? Tap again",()=>{ const o=byId(id); o.items=o.items.filter(x=>x.id!==el.dataset.item); if(!o.items.length) o.discount=0; syncPrice(o); save(); render(); sheetOrder(id); toast("Service removed"); });
  if(a==="discount") return sheetDiscount(id);
  if(a==="doc") return sheetDoc(id);
  if(a==="addcat") return sheetItem(null, null, null);
  if(a==="editcat") return sheetItem(null, null, el.dataset.cid);
  if(a==="delcat") return arm(el,"Remove? Tap again",()=>{ S.catalog=S.catalog.filter(x=>x.id!==el.dataset.item); save(); sheetData("catalog"); toast("Removed from price list"); });
  if(a==="savebiz"){ const g=k=>document.getElementById("bz-"+k).value.trim(); S.settings.business={name:g("name")||DEFAULT_BUSINESS, phone:g("phone"), address:g("address"), email:g("email"), note:g("note")}; save(); return toast("Business details saved"); }
  if(a==="saverate"){ const r=parseAmount(document.getElementById("set-rate").value,"IQD"); if(!(r>0)){ toast("Enter the rate as a number, e.g. 1,590"); return; } S.settings.rate=r; save(); render(); document.getElementById("set-rate").value=NF.IQD.format(r); return toast("Rate saved: $1 = IQD "+NF.IQD.format(r)); }
  if(a==="clearsample") return arm(el,"Sure? Tap again",()=>{ S=emptyState(); save(); render(); toast("Ready for real orders"); });
  if(a==="reset") return arm(el,"Delete all data? Tap again",()=>{ S=emptyState(); save(); closeSheet(); render(); toast("Everything deleted"); });
  if(a==="demo"){ const st={...S.settings}, cat=S.catalog; S=seed(); S.settings=st; if(cat && cat.length) S.catalog=cat; save(); closeSheet(); render(); return toast("Sample data loaded"); }
  if(a==="backup"){ exportBackup(); return; }
  if(a==="import"){ try{ importText(document.getElementById("imp").value); }catch(err){ toast("That is not a valid backup"); } return; }
});

@media (display-mode: standalone){:root{--edge:26px}}
.sheet{max-height:calc(100% - env(safe-area-inset-top,0px) - var(--edge) - 8px)}
/* solid band behind the status bar: content scrolling under it stays hidden instead of showing through blurred */
.statusband{position:fixed;left:0;right:0;top:0;height:calc(env(safe-area-inset-top,0px) + var(--edge));background:var(--bg);z-index:30;pointer-events:none;transition:background .2s}
body:has(.scrim) .statusband{background:color-mix(in srgb,var(--bg) 55%,#0a100e)}
.appbar{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:8;box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:608px;margin:0 auto}
.appbar.info{background:var(--accent-soft)}
</style>
<div class="statusband" aria-hidden="true"></div>
<div class="banner appbar" id="update-banner" role="status" hidden><span>A new version of the app is ready.</span><button id="update-btn">Update now</button></div>
<div class="banner appbar info" id="install-hint" hidden><span>Install: tap <b>Share</b> <svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true" style="vertical-align:-2px"><path d="M7 1v9M3.5 4.5 7 1l3.5 3.5M2 7.5v7h10v-7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg> then <b>Add to Home Screen</b>. The app then works offline.</span><button id="install-ok">OK</button></div>
<script>
(function(){
  "use strict";
  var standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  try{
    if(ios && !standalone && !localStorage.getItem("ob:install-hint")){
      var hint = document.getElementById("install-hint"); hint.hidden = false;
      document.getElementById("install-ok").onclick = function(){ hint.hidden = true; try{ localStorage.setItem("ob:install-hint","1"); }catch(e){} };
    }
  }catch(e){}
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
  if(!("serviceWorker" in navigator) || location.protocol === "file:") return;
  var hadController = !!navigator.serviceWorker.controller, reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(!hadController || reloading) return; reloading = true; location.reload();
  });
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").then(function(reg){
      function offer(w){
        if(!hadController || !w) return;
        var b = document.getElementById("update-banner"); b.hidden = false;
        document.getElementById("update-btn").onclick = function(){ w.postMessage("skipWaiting"); };
      }
      function track(w){ if(!w) return; if(w.state === "installed") return offer(w);
        w.addEventListener("statechange", function(){ if(w.state === "installed") offer(w); }); }
      if(reg.waiting) offer(reg.waiting);
      track(reg.installing);
      reg.addEventListener("updatefound", function(){ track(reg.installing); });
      reg.update().catch(function(){});
      document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible") reg.update().catch(function(){}); });
    }).catch(function(){});
  });
})();
</script>
</body>
</html>
